# ==============================================================================
# MINI ClassIsland 鑱氬悎浠撳簱 Nginx 閰嶇疆鏂囦欢 (WSL Ubuntu 閮ㄧ讲鐗?
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 涓婃父鏈嶅姟瀹氫箟 (Upstream)
# ------------------------------------------------------------------------------

# Core 鏍稿績鏈嶅姟 - Client API (闆嗘帶涓庤祫婧愪笅杞?
upstream core_client_api {
    server 127.0.0.1:27041;
}

# Core 鏍稿績鏈嶅姟 - Management API (鐢ㄦ埛涓庤处鎴风鐞?
upstream core_management_api {
    server 127.0.0.1:27042;
}

# Core 鏍稿績鏈嶅姟 - Admin API (绯荤粺涓庤秴绾х鐞嗗憳绠＄悊)
upstream core_admin_api {
    server 127.0.0.1:27043;
}

# Core 核心服务 - gRPC 服务 (Cyrene_MSP 协议)
upstream core_grpc_service {
    server 127.0.0.1:27044;
}

# 全局 API 速率限制区域 (按客户端 IP 限流)
limit_req_zone $binary_remote_addr zone=mci_api_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 2. 鍏ㄥ眬 HTTP 閲嶅畾鍚?# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 3. 鍩熷悕閲嶅畾鍚戜笌璺宠浆閰嶇疆
# ------------------------------------------------------------------------------

# dashboard.miniclassisland.com -> dash.miniclassisland.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://dash.miniclassisland.com$request_uri;
}

# miniclassisland.com -> dash.miniclassisland.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 302 https://dash.miniclassisland.com$request_uri;
}

# ------------------------------------------------------------------------------
# 4. Web 鍓嶇鏈嶅姟 (dash.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dash.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';" always;

    client_max_body_size 2m;

    root /home/ubuntu/miniclassisland/web/out;

    location / {
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';" always;
    }
}

# ------------------------------------------------------------------------------
# 5. 绠＄悊鍚庡彴鍓嶇涓?Admin API 鏈嶅姟 (admin.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';" always;

    client_max_body_size 2m;

    root /home/ubuntu/miniclassisland/admin/out;

    location = /api {
        limit_req zone=mci_api_limit burst=60 nodelay;
        proxy_pass http://core_admin_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=mci_api_limit burst=60 nodelay;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://core_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';" always;
    }
}

# ------------------------------------------------------------------------------
# 6. Management API 鏈嶅姟 (api.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://core_management_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 7. 閫氶厤绗﹀瓙鍩熷悕鏈嶅姟 (*.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' data:; frame-ancestors 'none';" always;

    client_max_body_size 2m;

    location / {
        error_page 418 = @grpc;
        if ($content_type ~* "^application/grpc") {
            return 418;
        }

        proxy_pass http://core_client_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @grpc {
        grpc_pass grpc://core_grpc_service;
        grpc_socket_keepalive on;

        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-Host $host;
        # API 与 gRPC 直连部署（不经过 CDN），直接使用 $remote_addr 防止伪造 X-Forwarded-For
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;

        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
    }
}
