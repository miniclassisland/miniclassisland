# ==============================================================================
# MINI ClassIsland 聚合仓库 Nginx 配置文件 (WSL Ubuntu 部署版)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 上游服务定义 (Upstream)
# ------------------------------------------------------------------------------

# Core 核心服务 - Client API (集控与资源下载)
upstream core_client_api {
    server 127.0.0.1:27041;
}

# Core 核心服务 - Management API (用户与账户管理)
upstream core_management_api {
    server 127.0.0.1:27042;
}

# Core 核心服务 - Admin API (系统与超级管理员管理)
upstream core_admin_api {
    server 127.0.0.1:27043;
}

# Core 核心服务 - gRPC 服务 (Cyrene_MSP 协议)
upstream core_grpc_service {
    server 127.0.0.1:27044;
}

# ------------------------------------------------------------------------------
# 2. 全局 HTTP 重定向
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# 3. 域名重定向与跳转配置
# ------------------------------------------------------------------------------

# dashboard.miniclassisland.com -> dash.miniclassisland.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://dash.miniclassisland.com$request_uri;
}

# miniclassisland.com -> dash.miniclassisland.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 302 https://dash.miniclassisland.com$request_uri;
}

# ------------------------------------------------------------------------------
# 4. Web 前端服务 (dash.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dash.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /home/ubuntu/miniclassisland/web/out;

    location / {
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ------------------------------------------------------------------------------
# 5. 管理后台前端与 Admin API 服务 (admin.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    root /home/ubuntu/miniclassisland/admin/out;

    location /api {
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://core_admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        index index.html;
        try_files $uri $uri.html $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# ------------------------------------------------------------------------------
# 6. Management API 服务 (api.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        proxy_pass http://core_management_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ------------------------------------------------------------------------------
# 7. 通配符子域名服务 (*.miniclassisland.com)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.miniclassisland.com;

    ssl_certificate     /home/ubuntu/miniclassisland/nginx/tls-cert/fullchain.pem;
    ssl_certificate_key /home/ubuntu/miniclassisland/nginx/tls-cert/privkey.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location / {
        error_page 418 = @grpc;
        if ($content_type ~* "^application/grpc") {
            return 418;
        }

        proxy_pass http://core_client_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @grpc {
        grpc_pass grpc://core_grpc_service;

        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
    }
}
